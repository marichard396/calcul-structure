function renderUnits() {
    const el = $('#tab-units');
    const s = state.project.settings;
    const presets = Object.entries(PRESETS)
        .map(([k, p]) => `<option value="${k}" ${k === s.unitPreset ? 'selected' : ''}>${p.label}</option>`)
        .join('') + `<option value="custom" ${s.unitPreset === 'custom' ? 'selected' : ''}>Personnalisé</option>`;
    const rows = Object.keys(UNITS).map((q) => `
    <div class="field field-row">
      <label for="u-${q}">${QUANTITY_LABELS[q]}</label>
      <select id="u-${q}" data-q="${q}">
        ${UNITS[q].map((u) => `<option value="${u.id}" ${u.id === s.units[q] ? 'selected' : ''}>${u.label}</option>`).join('')}
      </select>
    </div>`).join('');
    el.innerHTML = `
    <section data-sec="un-preset" class="block">
      <h2 class="h">Unités d'affichage</h2>
      <p class="small muted help">Les valeurs sont saisies et affichées dans ces unités. Les calculs se font toujours en SI (N, m, Pa) ; la conversion est automatique.</p>
      <div class="field">
        <label for="preset">Système</label>
        <select id="preset">${presets}</select>
      </div>
    </section>
    <section data-sec="un-each" class="block">
      <h2 class="h">Par grandeur</h2>
      ${rows}
    </section>`;
    $('#preset').onchange = (e) => {
        const k = e.target.value;
        if (PRESETS[k]) {
            s.unitPreset = k;
            s.units = { ...PRESETS[k].prefs };
        }
        markDirty();
        applyBC();
        applyDeformed();
        renderAll();
    };
    el.querySelectorAll('select[data-q]').forEach((sel) => {
        sel.onchange = () => {
            s.units[sel.dataset.q] = sel.value;
            s.unitPreset = 'custom';
            markDirty();
            applyBC();
            applyDeformed();
            renderAll();
        };
    });
}

function renderInspector() {
    const el = $('#inspector');
    const mesh = state.project.mesh;
    const nm = nodeMap(mesh);
    const conn = connectivity(mesh);
    const nN = state.selNodes.size, nE = state.selElems.size;
    const u = lenUnit();
    const modes = [['all', 'Tout'], ['elements', 'Éléments'], ['nodes', 'Nœuds']];
    const head = `
    <div class="seg" role="group" aria-label="Type de sélection">
      ${modes.map(([m, l]) => `<button class="seg-btn ${state.pickMode === m ? 'on' : ''}" data-mode="${m}">${l}</button>`).join('')}
    </div>`;
    let body = '';
    if (!mesh.nodes.length) {
        body = `<p class="empty-note">Aucun maillage chargé.</p>`;
    }
    else if (nN + nE === 0) {
        body = `
      <p class="hint">Cliquez un élément ou un nœud dans la vue. <kbd>Ctrl</kbd> ou <kbd>Maj</kbd> + clic pour en ajouter ou en retirer.</p>
      <div class="btn-row">
        <button class="btn btn-ghost" id="sel-all-el">Tous les éléments</button>
        <button class="btn btn-ghost" id="sel-all-n">Tous les nœuds</button>
      </div>`;
    }
    else if (nE === 1 && nN === 0) {
        const e = mesh.elements.find((x) => x.id === [...state.selElems][0]);
        const a = nm.get(e.n1), b = nm.get(e.n2);
        const L = elementLength(mesh, e, nm);
        const dc = [(b.x - a.x) / L, (b.y - a.y) / L, (b.z - a.z) / L].map((c) => formatNumber(c, 3));
        body = `
      <h2 class="ins-title">Élément <span>${e.id}</span></h2>
      <dl class="kv">
        <dt>Nœuds</dt><dd><button class="chip" data-n="${e.n1}">${e.n1}</button> → <button class="chip" data-n="${e.n2}">${e.n2}</button></dd>
        <dt>Longueur</dt><dd>${fmtLen(L)} ${u}</dd>
        <dt>Cosinus directeurs</dt><dd class="mono">${dc.join(' ; ')}</dd>
        ${e.splitFrom ? `<dt>Origine</dt><dd>découpé de l'élément ${e.splitFrom}</dd>` : ''}
      </dl>
      ${designDetailBlock()}
      ${resultBlock()}
      ${assignBlock()}
      ${designParamsBlock()}
      ${releaseBlock()}
      ${elementLoadBlock()}
      ${pointLoadBlock()}`;
    }
    else if (nN === 1 && nE === 0) {
        const n = nm.get([...state.selNodes][0]);
        const els = conn.get(n.id) ?? [];
        body = `
      <h2 class="ins-title">Nœud <span>${n.id}</span></h2>
      <dl class="kv">
        <dt>X</dt><dd>${fmtLen(n.x)} ${u}</dd>
        <dt>Y</dt><dd>${fmtLen(n.y)} ${u}</dd>
        <dt>Z</dt><dd>${fmtLen(n.z)} ${u}</dd>
        <dt>Éléments reliés</dt><dd>${els.map((id) => `<button class="chip" data-e="${id}">${id}</button>`).join(' ') || '—'}</dd>
      </dl>
      ${resultBlock()}
      ${nodeBlock()}`;
    }
    else {
        const total = [...state.selElems].reduce((s, id) => {
            const e = mesh.elements.find((x) => x.id === id);
            return s + (e ? elementLength(mesh, e, nm) : 0);
        }, 0);
        body = `
      <h2 class="ins-title">Sélection multiple</h2>
      <dl class="kv">
        ${nE ? `<dt>Éléments</dt><dd>${nE}</dd><dt>Longueur cumulée</dt><dd>${fmtLen(total)} ${u}</dd>` : ''}
        ${nN ? `<dt>Nœuds</dt><dd>${nN}</dd>` : ''}
      </dl>
      ${nE ? `<div class="chips">${[...state.selElems].sort((a, b) => a - b).map((id) => `<button class="chip" data-e="${id}">É${id}</button>`).join('')}</div>` : ''}
      ${nN ? `<div class="chips">${[...state.selNodes].sort((a, b) => a - b).map((id) => `<button class="chip" data-n="${id}">N${id}</button>`).join('')}</div>` : ''}
      ${nE ? assignBlock() + designParamsBlock() + releaseBlock() + elementLoadBlock() + pointLoadBlock() : ''}
      ${nN ? nodeBlock() : ''}`;
    }
    const foot = nN + nE ? `<button class="btn btn-ghost w100" id="sel-clear">Vider la sélection <kbd>Échap</kbd></button>` : '';
    el.innerHTML = `${head}<div class="ins-body">${body}</div>${foot}`;
    el.querySelectorAll('[data-mode]').forEach((b) => {
        b.onclick = () => { state.pickMode = b.dataset.mode; viewer.setPickMode(state.pickMode); renderInspector(); };
    });
    el.querySelectorAll('[data-n]').forEach((b) => (b.onclick = (e) => select([Number(b.dataset.n)], [], e.ctrlKey || e.shiftKey || e.metaKey)));
    el.querySelectorAll('[data-e]').forEach((b) => (b.onclick = (e) => select([], [Number(b.dataset.e)], e.ctrlKey || e.shiftKey || e.metaKey)));
    const sa = el.querySelector('#sel-all-el');
    if (sa)
        sa.onclick = () => select([], mesh.elements.map((e) => e.id), false);
    const sn = el.querySelector('#sel-all-n');
    if (sn)
        sn.onclick = () => select(mesh.nodes.map((n) => n.id), [], false);
    const sc = el.querySelector('#sel-clear');
    if (sc)
        sc.onclick = clearSelection;
    bindAssign(el);
    bindNodeBlock(el);
    bindElementLoadBlock(el);
    bindReleaseBlock(el);
    bindPointLoadBlock(el);
    bindElementChart(el);
    bindDesignParams(el);
}
// ------------------------------------------------------------------ barre d'état
function renderStatus() {
    const mesh = state.project.mesh;

    let hover = '';

    if (h?.kind === 'element') {
        const e = mesh.elements.find((x) => x.id === h.id);
        if (e)
            hover = `Élément ${e.id} · ${e.n1} → ${e.n2} · L = ${fmtLen(elementLength(mesh, e))} ${lenUnit()}`;
    }
    else if (h?.kind === 'node') {
        const n = mesh.nodes.find((x) => x.id === h.id);
        if (n)
            hover = `Nœud ${n.id} · (${fmtLen(n.x)} ; ${fmtLen(n.y)} ; ${fmtLen(n.z)}) ${lenUnit()}`;
    }
    const sel = state.selNodes.size + state.selElems.size;
    $('#status').innerHTML = `
    <span>${mesh.nodes.length} nœuds · ${mesh.elements.length} éléments</span>
    <span>${sel ? `${sel} sélectionné(s)` : ''}</span>
    <span class="grow hover-info">${esc(hover)}</span>
    <span>Axe vertical ${s.verticalAxis} · ${lenUnit()} · ${findUnit('force', s.units.force).label}</span>`;
}
function renderTabs() {
    const p = prj();
    const els = p.mesh.elements;
    const done = {
        model: els.length > 0,
        props: els.some((e) => !e.inactive) && els.every((e) => e.inactive || (getSection(e.sectionId) && getMaterial(e.materialId))),
        loads: els.length > 0 && readiness(loadCtx(), p.restraints, p.loadCases).every((r) => r.ok || r.level !== 'error'),
        results: !!state.results,
    };
    document.querySelectorAll('.tab').forEach((b) => {
        const on = b.dataset.tab === state.tab;
        b.classList.toggle('on', on);
        b.classList.toggle('done', !!done[b.dataset.tab]);
        b.setAttribute('aria-selected', String(on));
    });
    ['model', 'props', 'loads', 'results', 'tables', 'units'].forEach((t) => ($(`#tab-${t}`).hidden = t !== state.tab));
}
function renderToolbar() {
    const t = (id, on) => { const b = $(id); b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); };
    t('#tg-nodes', state.labelsNodes);
    t('#tg-elems', state.labelsElems);
    t('#tg-grid', state.grid);
    t('#tg-loads', state.showLoads);
    t('#tg-vals', state.showValues);
    $('#tg-proj').textContent = `Projection : ${viewer.getProjection() === 'persp' ? 'perspective' : 'orthographique'}`;
    renderDocTabs();
    if (window.self === window.top)
        document.title = `${state.dirty ? '• ' : ''}${state.project.mesh.nodes.length ? state.project.name + ' — ' : ''}Calcul de structure 3D`;
    $('#empty').hidden = state.project.mesh.nodes.length > 0;
    const tc = $('#top-calc');
    tc.textContent = state.results ? 'Recalculer' : 'Calculer';
    tc.classList.toggle('is-stale', state.stale);
}
function renderAll() {
    renderTabs();
    renderModel();
    if (state.tab === 'props')
        renderLibrary();
    if (state.tab === 'loads')
        renderLoads();
    if (state.tab === 'results')
        renderResults();
    if (state.tab === 'tables')
        renderTables();
    if (state.tab === 'units')
        renderUnits();
    renderInspector();
    renderLegend();
    renderStatus();
    renderToolbar();
}
// ------------------------------------------------------------------ démarrage
function start() {
    viewer = new Viewer($('#viewport'), {
        onPick: (p, additive) => {
            if (!p) {
                if (!additive)
                    clearSelection();
                return;
            }
            if (p.kind === 'node')
                select([p.id], [], additive);
            else
                select([], [p.id], additive);
        },
        onHover: (p) => { state.hover = p; renderStatus(); },
        onProbe: (id, x) => probeHtml(id, x),
        onProbeClick: (id, x) => {
            if (state.pins.some((pn) => pn.id === id && Math.abs(pn.x - x) < 1e-9))
                return;
            state.pins = [...state.pins, { id, x }].slice(-12);
            applyProbe();
            renderLegend();
        },
        onPinClose: (i) => { state.pins = state.pins.filter((_, k) => k !== i); applyProbe(); renderLegend(); },
    });
    document.querySelectorAll('.tab').forEach((b) => {
        b.onclick = () => { state.tab = b.dataset.tab; renderAll(); };
    });
    document.querySelectorAll('[data-view]').forEach((b) => {
        b.onclick = () => viewer.setView(b.dataset.view);
    });
    $('#tg-fit').onclick = () => viewer.fit();
    $('#tg-proj').onclick = () => { viewer.setProjection(viewer.getProjection() === 'persp' ? 'ortho' : 'persp'); renderToolbar(); };
    $('#tg-nodes').onclick = () => { state.labelsNodes = !state.labelsNodes; viewer.setLabels(state.labelsNodes, state.labelsElems); renderToolbar(); };
    $('#tg-elems').onclick = () => { state.labelsElems = !state.labelsElems; viewer.setLabels(state.labelsNodes, state.labelsElems); renderToolbar(); };
    $('#tg-grid').onclick = () => { state.grid = !state.grid; viewer.setGrid(state.grid); renderToolbar(); };
    $('#tg-loads').onclick = () => { state.showLoads = !state.showLoads; applyBC(); renderToolbar(); };
    $('#tg-vals').onclick = () => { state.showValues = !state.showValues; applyBC(); applyDiagram(); renderToolbar(); };
    $('#empty-example').onclick = () => { if (!isPristine())
        newTab(false); runImport(EXAMPLE_TEXT, EXAMPLE_NAME); };
    $('#top-calc').onclick = runSolve;
    // Sections repliables : appliquées après chaque mise à jour des panneaux
    const mo = new MutationObserver(() => { collapsify($('.side-left')); collapsify($('#inspector')); });
    mo.observe($('.side-left'), { childList: true, subtree: true });
    mo.observe($('#inspector'), { childList: true, subtree: true });
    // Aide
    let helpOn = false;
    try {
        helpOn = localStorage.getItem(HELP_KEY) === '1';
    }
    catch { /* */ }
    setHelp(helpOn);
    $('#tg-help').onclick = () => setHelp(!state.help);
    // Menu Affichage
    const menuBtn = $('#tg-menu'), menu = $('#view-menu');
    const closeMenu = () => { menu.hidden = true; menuBtn.setAttribute('aria-expanded', 'false'); };
    menuBtn.onclick = (e) => { e.stopPropagation(); menu.hidden = !menu.hidden; menuBtn.setAttribute('aria-expanded', String(!menu.hidden)); };
    document.addEventListener('click', (e) => { if (!menu.hidden && !menu.contains(e.target))
        closeMenu(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !menu.hidden) {
        closeMenu();
        menuBtn.focus();
    } });
    $('#top-open').onclick = openDialog;
    $('#top-save').onclick = () => saveProject();
    const pf = $('#proj-file');
    pf.onchange = () => { const f = pf.files?.[0]; if (f)
        openAnyFile(f); pf.value = ''; };
    // Dépôt d'un fichier n'importe où sur la vue 3D
    const vp = $('#viewport');
    vp.addEventListener('dragover', (e) => { e.preventDefault(); vp.classList.add('drop-over'); });
    vp.addEventListener('dragleave', () => vp.classList.remove('drop-over'));
    vp.addEventListener('drop', (e) => {
        e.preventDefault();
        vp.classList.remove('drop-over');
        dropFile(e.dataTransfer);
    });
    window.addEventListener('keydown', (e) => {
        const tag = e.target.tagName;
        if ((tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') && !((e.ctrlKey || e.metaKey) && ['s', 'o'].includes(e.key.toLowerCase())))
            return;
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            saveProject(e.shiftKey);
            return;
        }
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') {
            e.preventDefault();
            openDialog();
            return;
        }
        if (e.key === 'Escape')
            clearSelection();
        else if (e.key === 'f' || e.key === 'F')
            viewer.fit();
        else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') {
            e.preventDefault();
            select([], state.project.mesh.elements.map((x) => x.id), false);
        }
    });
    // Thème clair / sombre
    const retheme = () => requestAnimationFrame(() => { viewer.applyTheme(); applyColors(); applyBC(); applyDeformed(); });
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
    new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    // Application installée : avertir avant de fermer avec des modifications non enregistrées
    if (window.self === window.top)
        window.addEventListener('beforeunload', (e) => { snapshotDoc(); if (docs.some((d) => d.dirty)) {
            e.preventDefault();
            e.returnValue = '';
        } });
    // Ouvre sur l'exemple pour montrer l'outil en état de marche
    checkRecovery();
    runImport(EXAMPLE_TEXT, EXAMPLE_NAME);
    docs.push({});
    snapshotDoc();
    renderDocTabs();
    heartbeat();
    setInterval(heartbeat, 10000);
    window.addEventListener('pagehide', () => {
        writeAutosave();
        try {
            localStorage.removeItem(ALIVE_PREFIX + WIN_ID);
        }
        catch { /* */ }
    });
}

start();

</script>

<div class="update-bar" id="update-bar" role="status" hidden>
  <span>Une nouvelle version de l'application est disponible.</span>
  <button type="button" id="update-go">Mettre à jour</button>
</div>
<script>
// Service worker : fonctionnement hors ligne et mises à jour (version 04194d3e3f)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('sw.js');
      const bar = document.getElementById('update-bar');
      let accepted = false; // ne recharger que si l'utilisateur a accepté la mise à jour
      const offer = (w) => {
        bar.hidden = false;
        document.getElementById('update-go').onclick = () => { accepted = true; w.postMessage('skip-waiting'); };
      };
      if (reg.waiting && navigator.serviceWorker.controller) offer(reg.waiting);
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        w && w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) offer(w); });
      });
      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => { if (accepted && !reloading) { reloading = true; location.reload(); } });
      setInterval(() => reg.update().catch(() => {}), 60 * 60 * 1000);
    } catch (e) { console.warn('Service worker non enregistré :', e); }
  });
}
</script>
